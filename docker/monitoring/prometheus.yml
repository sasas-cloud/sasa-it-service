global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'nextcloud-exporter'
    static_configs:
      - targets: ['nextcloud-exporter:9117']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
