version: "3.8"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: sasa-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana-oss:latest
    container_name: sasa-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-changeme}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - monitoring

  nextcloud-exporter:
    image: niklausw/nextcloud-exporter:latest
    container_name: sasa-nextcloud-exporter
    restart: unless-stopped
    environment:
      - NEXTCLOUD_SERVER=https://office.sasa-it.de
      - NEXTCLOUD_USERNAME=${NEXTCLOUD_EXPORTER_USER:-admin}
      - NEXTCLOUD_PASSWORD=${NEXTCLOUD_EXPORTER_PASSWORD:-changeme}
      - NEXTCLOUD_SKIP_VERIFY=true
    ports:
      - "9117:9117"
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:latest
    container_name: sasa-alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
